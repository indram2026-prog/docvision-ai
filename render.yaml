# Render Blueprint: New > Blueprint > pick this repo. One service serves the UI and the API on one URL.
services:
  - type: web
    name: docvision-ai
    runtime: docker
    # OCR + OpenCV need real memory: choose a plan with at least 1-2 GB RAM (check Render's current plans).
    plan: standard
    healthCheckPath: /api/health
    envVars:
      - key: WEB_CONCURRENCY
        value: "1"
